<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Incident Notification & Report Generator</title>
    <style>
      :root {
        --ink: #101a2c;
        --ink-soft: #4b5875;
        --muted: #8792a8;
        --canvas: #eef1f7;
        --panel: #ffffff;
        --line: #dfe4ee;
        --line-soft: #eceff5;

        --accent: #2451c4;
        --accent-ink: #ffffff;
        --accent-soft: #e8eefc;

        --ok: #157a4d;
        --ok-soft: #e4f6ed;
        --warn: #b25e05;
        --warn-soft: #fdf0dc;
        --bad: #c22b3d;
        --bad-soft: #fbe6e9;

        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 7px;
        --shadow:
          0 1px 2px rgba(16, 26, 44, 0.04),
          0 12px 28px -14px rgba(16, 26, 44, 0.18);

        --font-ui:
          "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono:
          "IBM Plex Mono", "SFMono-Regular", Consolas, "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-ui);
        background: var(--canvas);
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(16, 26, 44, 0.045) 1px,
          transparent 0
        );
        background-size: 22px 22px;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
      }

      /* ---------- Header ---------- */
      .page-header {
        background: var(--ink);
        padding: 18px 24px;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .header-inner {
        max-width: 1400px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(155deg, #3a63d8, #2451c4 55%, #1c3f9e);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .brand-mark svg {
        width: 18px;
        height: 18px;
      }
      .brand h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        color: #f4f6fb;
        letter-spacing: -0.1px;
      }
      .brand p {
        margin: 2px 0 0;
        color: #94a1bd;
        font-size: 12px;
      }
      .header-status {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        font-weight: 650;
        color: #86e0af;
        background: rgba(21, 122, 77, 0.22);
        border: 1px solid rgba(21, 122, 77, 0.4);
        padding: 6px 11px 6px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .header-status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3fd47f;
        box-shadow: 0 0 0 3px rgba(63, 212, 127, 0.22);
      }

      /* ---------- Layout ---------- */
      .container {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
        gap: 20px;
        max-width: 1400px;
        margin: 24px auto 100px;
        padding: 0 20px;
        align-items: start;
      }

      .form-section,
      .output-section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }
      .form-section {
        padding: 26px;
      }
      .output-section {
        padding: 20px;
        position: sticky;
        top: 88px;
      }

      .section-title,
      .output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }
      .section-title h3,
      .output-header h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        color: var(--ink);
      }
      .section-badge {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 5px 9px;
        border-radius: 999px;
      }

      fieldset {
        border: 0;
        margin: 0 0 24px;
        padding: 0;
      }
      fieldset legend {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.25px;
        padding: 0 0 10px;
        width: 100%;
        border-bottom: 1px solid var(--line-soft);
        margin-bottom: 16px;
      }

      .form-group {
        margin-bottom: 16px;
      }
      .form-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 12.5px;
        color: var(--ink-soft);
      }

      input[type="text"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        outline: 0;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      input[type="text"]:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      input:disabled,
      select:disabled {
        background: #f3f5f9;
        color: #a6afc2;
        cursor: not-allowed;
      }
      textarea {
        resize: vertical;
        min-height: 76px;
        line-height: 1.5;
        font-family: var(--font-ui);
      }
      select {
        cursor: pointer;
      }

      .row {
        display: flex;
        gap: 12px;
      }
      .row .form-group {
        flex: 1;
        min-width: 0;
      }

      .time-group {
        display: grid;
        grid-template-columns: 1.6fr 0.85fr auto 0.85fr;
        gap: 7px;
        align-items: center;
      }
      .time-group span {
        color: var(--muted);
        font-weight: 700;
        text-align: center;
      }

      .monthly-box {
        background: var(--accent-soft);
        border: 1px solid #c9daf8;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        margin-bottom: 22px;
      }
      .monthly-box label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #1c3f9e;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      .monthly-box input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        flex-shrink: 0;
      }

      .checkbox-inline {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .checkbox-inline input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .attendance-box {
        border: 1px solid var(--line);
        padding: 13px;
        border-radius: var(--radius-md);
        background: #fbfcfe;
      }
      .attendance-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }
      .att-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #fff;
        padding: 7px 8px 7px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
        font-weight: 650;
        color: var(--ink-soft);
      }
      .att-item select {
        width: auto;
        min-width: 50px;
        padding: 4px 5px;
        font-size: 13px;
        border-color: var(--line-soft);
      }
      .custom-att-input {
        display: flex;
        gap: 7px;
      }
      .custom-att-input input {
        font-size: 13px;
      }
      .btn-add-team {
        width: auto !important;
        padding: 0 14px !important;
        background: var(--ink) !important;
        color: #fff !important;
        flex-shrink: 0;
      }

      .chrono-box {
        border: 1px solid #cfdcf6;
        background: #f7f9fe;
        padding: 14px;
        border-radius: var(--radius-md);
      }
      .chrono-item {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 12px;
        margin-bottom: 10px;
      }
      .chrono-item:last-of-type {
        margin-bottom: 14px;
      }
      .chrono-header {
        display: grid;
        grid-template-columns: 1.3fr 68px auto 68px auto;
        gap: 7px;
        align-items: center;
        margin-bottom: 9px;
      }
      .chrono-header input,
      .chrono-header select {
        padding: 7px 8px;
        font-size: 12.5px;
      }
      .chrono-item textarea {
        font-family: var(--font-ui);
        font-size: 13px;
      }

      .btn-del-chrono {
        background: var(--bad-soft) !important;
        color: var(--bad) !important;
        border: 1px solid #f4c3ca !important;
        padding: 7px 10px !important;
        border-radius: var(--radius-sm) !important;
        width: auto !important;
        font-size: 11.5px !important;
      }

      button {
        border: 0;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 650;
        font-size: 12.5px;
        font-family: inherit;
        transition:
          filter 0.12s,
          transform 0.05s;
      }
      button:hover {
        filter: brightness(0.94);
      }
      button:active {
        transform: translateY(1px);
      }

      .btn-add {
        background: var(--ok);
        color: #fff;
        width: 100%;
        padding: 11px;
      }

      pre {
        margin: 0;
        min-height: 380px;
        max-height: calc(100vh - 320px);
        overflow: auto;
        background: #0d1424;
        color: #d7ddec;
        padding: 17px;
        border-radius: var(--radius-md);
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        border: 1px solid #1c2540;
      }

      .output-controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 12px;
      }

      .template-selector-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .btn-copy {
        background: var(--accent);
        color: #fff;
        width: 100%;
        padding: 11px;
        font-size: 13px;
      }
      .btn-reset {
        background: #5b6479;
        color: #fff;
        width: 100%;
        padding: 11px;
        font-size: 13px;
      }
      .btn-export {
        background: #1c3f9e;
        color: #fff;
        width: 100%;
      }
      .btn-import {
        background: var(--warn);
        color: #fff;
        width: 100%;
      }

      #saveStatus {
        text-align: center;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ok);
        min-height: 18px;
        margin-top: 9px;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 1000px) {
        .container {
          grid-template-columns: 1fr;
          margin-bottom: 90px;
        }
        .output-section {
          position: static;
        }
        pre {
          max-height: 460px;
          min-height: 320px;
        }
      }

      @media (max-width: 650px) {
        body {
          font-size: 14px;
        }
        .page-header {
          padding: 14px 16px;
        }
        .brand h1 {
          font-size: 14.5px;
        }
        .brand p {
          display: none;
        }
        .header-status span:not(.dot) {
          display: none;
        }
        .header-status {
          padding: 7px;
        }

        .container {
          padding: 0 14px;
          margin: 16px auto 96px;
          gap: 14px;
        }
        .form-section,
        .output-section {
          padding: 17px;
          border-radius: 13px;
        }

        .row {
          flex-direction: column;
          gap: 0;
        }
        .row .form-group {
          margin-bottom: 16px;
        }

        input[type="text"],
        select,
        textarea {
          font-size: 16px;
        }

        .time-group {
          grid-template-columns: 1fr 0.75fr auto 0.75fr;
        }

        .chrono-header {
          grid-template-columns: 1fr 62px auto 62px;
        }
        .chrono-header .btn-del-chrono {
          grid-column: 1 / -1;
          margin-top: 2px;
        }

        .attendance-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        pre {
          font-size: 11.5px;
          max-height: 380px;
        }
      }

      .mobile-copy-bar {
        display: none;
      }
      @media (max-width: 1000px) {
        .mobile-copy-bar {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
          background: rgba(255, 255, 255, 0.92);
          backdrop-filter: blur(10px);
          border-top: 1px solid var(--line);
          z-index: 40;
        }
        .mobile-copy-bar button {
          width: 100%;
          padding: 13px;
          font-size: 14px;
          background: var(--accent);
          color: #fff;
          border-radius: 10px;
        }
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 3L4 7v5c0 4.6 3.2 8.6 8 9.9 4.8-1.3 8-5.3 8-9.9V7l-8-4z"
                stroke="#eaf0ff"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M12 8v5m0 3h.01"
                stroke="#eaf0ff"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div>
            <h1>Incident Notification & Report</h1>
            <p>Incident builder · history management</p>
          </div>
        </div>
        <div class="header-status">
          <span class="dot"></span><span>Auto Save</span>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="form-section">
        <div class="section-title">
          <h3>Input Incident Details</h3>
        </div>

        <div class="monthly-box">
          <label>
            <input type="checkbox" id="isMonthly" />
            <span
              ><strong>Is Monthly Incident?</strong> (Menambahkan [MTH])</span
            >
          </label>
        </div>

        <fieldset>
          <legend>Identitas Incident</legend>

          <div class="row">
            <div class="form-group" style="flex: 1">
              <label for="prefix">Prefix / Category</label>
              <select id="prefix">
                <option value="[DTO]">[DTO]</option>
                <option value="[DVO]">[DVO]</option>
                <option value="[DLO]" selected>[DLO]</option>
              </select>
            </div>
            <div class="form-group" style="flex: 2">
              <label for="title">Judul Incident</label>
              <input
                type="text"
                id="title"
                placeholder="contoh: EDW_DLY_DASH_PINJAMAN_BOD Mengalami Failed pada Step 1"
                value="EDW_DLY_DASH_PINJAMAN_BOD Mengalami Failed pada Step 1"
              />
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="iris">IRIS</label>
              <input type="text" id="iris" placeholder="TBA" value="TBA" />
            </div>
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status">
                <option value="In Progress" selected>In Progress</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
            <div class="form-group">
              <label for="severity">Severity</label>
              <select id="severity">
                <option value="P1 (Critical)">P1 (Critical)</option>
                <option value="P2 (High)">P2 (High)</option>
                <option value="P3 (Medium)" selected>P3 (Medium)</option>
                <option value="P4 (Low)">P4 (Low)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="coordLink">Link Koordinasi</label>
            <input
              type="text"
              id="coordLink"
              placeholder="https://..."
              value="https://bbri.id/DataPipelineCoordinationRoom1"
            />

            <label class="checkbox-inline">
              <input type="checkbox" id="hasNcm" onchange="toggleNcmInput()" />
              <span>Ada Link NCM?</span>
            </label>

            <label class="checkbox-inline">
              <input
                type="checkbox"
                id="hasDeployment"
                onchange="toggleDeploymentInput()"
              />
              <span>Ada Impacted Deployment?</span>
            </label>
          </div>

          <div
            class="form-group"
            id="ncmGroup"
            style="display: none; margin-top: 10px"
          >
            <label for="ncmLink">Link NCM</label>
            <input
              type="text"
              id="ncmLink"
              placeholder="https://..."
              value=""
            />
          </div>

          <div
            class="form-group"
            id="deploymentGroup"
            style="display: none; margin-top: 10px"
          >
            <label for="deploymentLink">Impacted Deployment</label>
            <input
              type="text"
              id="deploymentLink"
              placeholder="https://..."
              value=""
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Waktu Kejadian</legend>

          <div class="form-group">
            <label for="startDate">Incident Start Date & Time</label>
            <div class="time-group">
              <input type="text" id="startDate" placeholder="DD/MM/YYYY" />
              <select id="startHour"></select>
              <span>:</span>
              <select id="startMin"></select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Attendance Team</legend>
          <div class="form-group" style="margin-bottom: 0">
            <div class="attendance-box">
              <div class="attendance-grid" id="attendanceGrid"></div>
              <div class="custom-att-input">
                <input
                  type="text"
                  id="customTeamInput"
                  placeholder="+ Tambah Tim Manual (misal: PAS)"
                />
                <button
                  type="button"
                  class="btn-add-team"
                  onclick="addCustomTeam()"
                >
                  + Add
                </button>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Analisa & Dampak</legend>

          <div class="form-group">
            <label for="rca">RCA</label>
            <textarea id="rca" placeholder="TBA">TBA</textarea>
          </div>

          <div class="form-group">
            <label for="resolution">Resolution</label>
            <textarea id="resolution" placeholder="TBA">TBA</textarea>
          </div>

          <div class="form-group">
            <label for="impacted">Service / Job Impacted</label>
            <textarea id="impacted" placeholder="TBA"></textarea>
          </div>
        </fieldset>

        <fieldset style="margin-bottom: 0">
          <legend>Kronologi / Description</legend>
          <div class="chrono-box">
            <div id="chronoListContainer"></div>
            <button type="button" class="btn-add" onclick="addChronoItem()">
              + Tambah Timestamp Kronologi
            </button>
          </div>
        </fieldset>
      </div>

      <div class="output-section">
        <div class="output-header">
          <h3>Hasil Text Format</h3>
          <span
            class="header-status"
            style="
              background: var(--ok-soft);
              border-color: #bfe6d1;
              color: var(--ok);
            "
          >
        </div>

        <div class="output-controls">
          <div class="template-selector-group">
            <label for="templateMode">Pilih Format Output:</label>
            <select id="templateMode" onchange="generateText()">
              <option value="full" selected>
                Incident Notification / Report
              </option>
              <option value="quick">Quick Incident</option>
            </select>
          </div>
        </div>

        <pre id="output"></pre>

        <div class="action-grid" style="margin-top: 12px">
          <button class="btn-copy" onclick="copyText()">Copy Text</button>
          <button type="button" class="btn-reset" onclick="resetToTemplate()">
            ↺ Template Awal
          </button>
          <button type="button" class="btn-export" onclick="exportTxt()">
            ⬇ Export TXT
          </button>
          <button
            type="button"
            class="btn-import"
            onclick="document.getElementById('importTxtFile').click()"
          >
            ⬆ Import TXT
          </button>
        </div>
        <div id="saveStatus"></div>
        <input
          type="file"
          id="importTxtFile"
          accept=".txt,text/plain"
          style="display: none"
          onchange="importTxt(event)"
        />
      </div>
    </div>

    <div class="mobile-copy-bar">
      <button type="button" onclick="copyText()">Copy Text Output</button>
    </div>

    <script>
      const STORAGE_KEY = "incidentNotificationTemplate";

      const defaultTeams = ["DTO", "DVO", "DLO", "BIV", "DEA", "DVD", "SDK"];
      const attendanceState = {};
      defaultTeams.forEach((team) => (attendanceState[team] = "OFF"));

      const chronoData = [];

      function toggleNcmInput() {
        const hasNcm = document.getElementById("hasNcm").checked;
        const ncmGroup = document.getElementById("ncmGroup");
        ncmGroup.style.display = hasNcm ? "block" : "none";
        generateText();
        saveToLocalStorage();
      }

      function toggleDeploymentInput() {
        const hasDeployment = document.getElementById("hasDeployment").checked;
        const deploymentGroup = document.getElementById("deploymentGroup");
        deploymentGroup.style.display = hasDeployment ? "block" : "none";
        generateText();
        saveToLocalStorage();
      }

      function getLastChronoFormatted() {
        if (chronoData.length > 0) {
          const lastChrono = chronoData[chronoData.length - 1];
          if (lastChrono.date && lastChrono.hour && lastChrono.min) {
            return `[${lastChrono.date} ${lastChrono.hour}:${lastChrono.min}]`;
          }
        }
        return "";
      }

      function getFormData() {
        return {
          isMonthly: document.getElementById("isMonthly").checked,
          hasNcm: document.getElementById("hasNcm").checked,
          ncmLink: document.getElementById("ncmLink").value,
          hasDeployment: document.getElementById("hasDeployment").checked,
          deploymentLink: document.getElementById("deploymentLink").value,
          prefix: document.getElementById("prefix").value,
          title: document.getElementById("title").value,
          iris: document.getElementById("iris").value,
          status: document.getElementById("status").value,
          severity: document.getElementById("severity").value,
          coordLink: document.getElementById("coordLink").value,
          templateMode: document.getElementById("templateMode").value,
          startDate: document.getElementById("startDate").value,
          startHour: document.getElementById("startHour").value,
          startMin: document.getElementById("startMin").value,
          rca: document.getElementById("rca").value,
          resolution: document.getElementById("resolution").value,
          impacted: document.getElementById("impacted").value,
          attendanceState: { ...attendanceState },
          chronoData: chronoData.map((item) => ({ ...item })),
        };
      }

      function saveToLocalStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(getFormData()));
          showSaveStatus("✓ Tersimpan otomatis");
        } catch (e) {
          console.error("Gagal menyimpan Local Storage:", e);
        }
      }

      function loadFromLocalStorage() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return false;

          const data = JSON.parse(saved);

          if (typeof data.isMonthly === "boolean")
            document.getElementById("isMonthly").checked = data.isMonthly;

          if (typeof data.hasNcm === "boolean") {
            document.getElementById("hasNcm").checked = data.hasNcm;
            toggleNcmInput();
          }

          if (typeof data.hasDeployment === "boolean") {
            document.getElementById("hasDeployment").checked =
              data.hasDeployment;
            toggleDeploymentInput();
          }

          const fields = [
            "prefix",
            "title",
            "iris",
            "status",
            "severity",
            "coordLink",
            "ncmLink",
            "deploymentLink",
            "templateMode",
            "startDate",
            "startHour",
            "startMin",
            "rca",
            "resolution",
            "impacted",
          ];

          fields.forEach((id) => {
            if (data[id] !== undefined && document.getElementById(id)) {
              document.getElementById(id).value = data[id];
            }
          });

          if (data.attendanceState) {
            Object.keys(attendanceState).forEach((team) => {
              if (data.attendanceState[team] !== undefined) {
                attendanceState[team] = data.attendanceState[team];
              }
            });

            Object.keys(data.attendanceState).forEach((team) => {
              if (!attendanceState.hasOwnProperty(team)) {
                attendanceState[team] = data.attendanceState[team];
              }
            });
          }

          chronoData.length = 0;
          if (Array.isArray(data.chronoData) && data.chronoData.length > 0) {
            data.chronoData.forEach((item) => {
              chronoData.push({
                date: item.date || "",
                hour: item.hour || "00",
                min: item.min || "00",
                text: item.text || "",
              });
            });
          }

          return true;
        } catch (e) {
          console.error("Gagal membaca Local Storage:", e);
          return false;
        }
      }

      function showSaveStatus(message) {
        const statusEl = document.getElementById("saveStatus");
        if (!statusEl) return;

        statusEl.textContent = message;
        clearTimeout(window.saveStatusTimer);
        window.saveStatusTimer = setTimeout(() => {
          statusEl.textContent = "";
        }, 1500);
      }

      function resetToTemplate() {
        if (
          !confirm(
            "Kembalikan semua pengisian ke template awal? Data yang tersimpan di Local Storage akan dihapus.",
          )
        ) {
          return;
        }

        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }

      function renderAttendanceGrid() {
        const grid = document.getElementById("attendanceGrid");
        grid.innerHTML = "";

        Object.keys(attendanceState).forEach((team) => {
          const div = document.createElement("div");
          div.className = "att-item";

          const label = document.createElement("span");
          label.textContent = team;

          const select = document.createElement("select");
          const options = [
            { label: "Off", val: "OFF" },
            { label: "✅", val: "✅" },
            { label: "⏳", val: "⏳" },
            { label: "❌", val: "❌" },
          ];

          options.forEach((opt) => {
            const o = new Option(opt.label, opt.val);
            if (attendanceState[team] === opt.val) o.selected = true;
            select.add(o);
          });

          select.addEventListener("change", (e) => {
            attendanceState[team] = e.target.value;
            generateText();
            saveToLocalStorage();
          });

          div.appendChild(label);
          div.appendChild(select);
          grid.appendChild(div);
        });
      }

      function addCustomTeam() {
        const input = document.getElementById("customTeamInput");
        const teamName = input.value.trim().toUpperCase();

        if (teamName && !attendanceState[teamName]) {
          attendanceState[teamName] = "✅";
          input.value = "";
          renderAttendanceGrid();
          generateText();
          saveToLocalStorage();
        }
      }

      const today = new Date();
      const dd = String(today.getDate()).padStart(2, "0");
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const yyyy = today.getFullYear();
      const dateStr = `${dd}/${mm}/${yyyy}`;

      document.getElementById("startDate").value = dateStr;

      const startHour = document.getElementById("startHour");
      const startMin = document.getElementById("startMin");

      for (let i = 0; i < 24; i++) {
        const val = String(i).padStart(2, "0");
        startHour.add(new Option(val, val));
      }

      for (let i = 0; i < 60; i++) {
        const val = String(i).padStart(2, "0");
        startMin.add(new Option(val, val));
      }

      startHour.value = "17";
      startMin.value = "30";

      function addChronoItem(textVal = "", customData = null) {
        const sDate = document.getElementById("startDate").value || dateStr;
        const sH = document.getElementById("startHour").value || "17";
        const sM = document.getElementById("startMin").value || "30";

        chronoData.push(
          customData || {
            date: sDate,
            hour: sH,
            min: sM,
            text: textVal,
          },
        );

        renderChronoItems();
        generateText();
        saveToLocalStorage();
      }

      function renderChronoItems() {
        const container = document.getElementById("chronoListContainer");
        container.innerHTML = "";

        chronoData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "chrono-item";

          const header = document.createElement("div");
          header.className = "chrono-header";

          const dateInp = document.createElement("input");
          dateInp.type = "text";
          dateInp.value = item.date;
          dateInp.placeholder = "DD/MM/YYYY";
          dateInp.addEventListener("input", (e) => {
            item.date = e.target.value;
            generateText();
            saveToLocalStorage();
          });

          const hSel = document.createElement("select");
          for (let i = 0; i < 24; i++) {
            const v = String(i).padStart(2, "0");
            hSel.add(new Option(v, v));
          }
          hSel.value = item.hour;
          hSel.addEventListener("change", (e) => {
            item.hour = e.target.value;
            generateText();
            saveToLocalStorage();
          });

          const mSel = document.createElement("select");
          for (let i = 0; i < 60; i++) {
            const v = String(i).padStart(2, "0");
            mSel.add(new Option(v, v));
          }
          mSel.value = item.min;
          mSel.addEventListener("change", (e) => {
            item.min = e.target.value;
            generateText();
            saveToLocalStorage();
          });

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn-del-chrono";
          delBtn.textContent = "✕ Hapus";
          delBtn.onclick = () => {
            chronoData.splice(index, 1);
            renderChronoItems();
            generateText();
            saveToLocalStorage();
          };

          header.appendChild(dateInp);
          header.appendChild(hSel);
          header.appendChild(document.createTextNode(":"));
          header.appendChild(mSel);
          header.appendChild(delBtn);

          const txtArea = document.createElement("textarea");
          txtArea.style.height = "60px";
          txtArea.style.marginTop = "4px";
          txtArea.placeholder =
            "Tuliskan deskripsi kronologi untuk timestamp ini...";
          txtArea.value = item.text;
          txtArea.addEventListener("input", (e) => {
            item.text = e.target.value;
            generateText();
            saveToLocalStorage();
          });

          card.appendChild(header);
          card.appendChild(txtArea);
          container.appendChild(card);
        });
      }

      function generateText() {
        const mode = document.getElementById("templateMode").value;
        const prefix = document.getElementById("prefix").value;
        const isMonthly = document.getElementById("isMonthly").checked;
        const monthlyTag = isMonthly ? " [MTH]" : "";
        const title = document.getElementById("title").value;
        const iris = document.getElementById("iris").value || "TBA";
        const status = document.getElementById("status").value;
        const severity = document.getElementById("severity").value;
        const rca = document.getElementById("rca").value || "TBA";
        const resolution = document.getElementById("resolution").value || "TBA";
        const impacted = document.getElementById("impacted").value || "";
        const coordLink = document.getElementById("coordLink").value || "";

        const hasNcm = document.getElementById("hasNcm").checked;
        const ncmLink = document.getElementById("ncmLink").value || "";
        const ncmFormatted = hasNcm ? `\n\nLink NCM:\n${ncmLink}` : "";

        const hasDeployment = document.getElementById("hasDeployment").checked;
        const deploymentLink =
          document.getElementById("deploymentLink").value || "";
        const deploymentFormatted = hasDeployment
          ? `\n\nImpacted Deployment :\n${deploymentLink}`
          : "";

        const attList = [];
        Object.keys(attendanceState).forEach((team) => {
          const statusIcon = attendanceState[team];
          if (statusIcon !== "OFF") {
            attList.push(`${team} ${statusIcon}`);
          }
        });
        const attendanceStr = attList.join(" | ");

        let template = "";

        if (mode === "quick") {
          template = `*QUICK INCIDENT*
==============
Incident Name : ${prefix}${monthlyTag} - ${title}
IRIS : ${iris}
Incident Status : ${status}
Incident Severity :${severity}
RCA : ${rca}
Service/Job Impacted : 
${impacted}

Attendence:
${attendanceStr}

Link Koordinasi : ${coordLink}${hasNcm ? `\n* Link NCM : ${ncmLink}` : ""}${hasDeployment ? `\n* Impacted Deployment : ${deploymentLink}` : ""}`;
        } else {
          const headerTitle =
            status === "Resolved" ? "INCIDENT REPORT" : "INCIDENT NOTIFICATION";
          const headerDivider = "=".repeat(headerTitle.length);

          const sDate = document.getElementById("startDate").value;
          const sH = document.getElementById("startHour").value;
          const sM = document.getElementById("startMin").value;
          const startTimeFormatted = sDate ? `[${sDate} ${sH}:${sM}]` : "";

          const endTimeFormatted =
            status === "Resolved" ? getLastChronoFormatted() : "";

          const chronoTextArr = chronoData.map((item) => {
            const timeTag = `[${item.date || ""} ${item.hour}:${item.min}]`;
            return `${timeTag}\n${item.text}`;
          });

          const chronologyFormatted = chronoTextArr.join("\n\n");

          template = `${headerTitle}
${headerDivider}
Incident Name: ${prefix}${monthlyTag} - ${title}
IRIS: ${iris}
Incident Status: ${status}
Incident Severity: ${severity}
Incident Start: ${startTimeFormatted}
Incident Resolved: ${endTimeFormatted}

RCA : 
${rca}

Service Impacted:
${impacted}

Resolution : 
${resolution}

Attendance:
${attendanceStr}

Link Koordinasi:
${coordLink}${ncmFormatted}${deploymentFormatted}

[Description/Chronology]

${chronologyFormatted}`;
        }

        document.getElementById("output").textContent = template;
      }

      document.getElementById("status").addEventListener("change", function () {
        generateText();
        saveToLocalStorage();
      });

      document
        .getElementById("startDate")
        .addEventListener("input", function () {
          if (chronoData.length > 0) {
            chronoData[0].date = this.value;
            renderChronoItems();
            generateText();
          }
          saveToLocalStorage();
        });

      document.getElementById("isMonthly").addEventListener("change", () => {
        generateText();
        saveToLocalStorage();
      });

      const restored = loadFromLocalStorage();

      renderAttendanceGrid();

      if (!restored) {
        addChronoItem("Tim DLO ...");
      } else {
        renderChronoItems();
      }

      generateText();

      document
        .querySelectorAll("input, select, textarea")
        .forEach((element) => {
          element.addEventListener("input", () => {
            generateText();
            saveToLocalStorage();
          });

          element.addEventListener("change", () => {
            generateText();
            saveToLocalStorage();
          });
        });

      function exportTxt() {
        saveToLocalStorage();
        const data = getFormData();
        const exportData = {
          format: "INCIDENT_NOTIFICATION_TEMPLATE_TXT",
          version: 1,
          exportedAt: new Date().toISOString(),
          data,
        };

        const fileContent = `--- INCIDENT_DATA_JSON ---
${JSON.stringify(exportData, null, 2)}
--- END_INCIDENT_DATA_JSON ---

${document.getElementById("output").textContent}`;

        const blob = new Blob([fileContent], {
          type: "text/plain;charset=utf-8",
        });
        const title =
          (data.title || "incident")
            .replace(/[\\/:*?"<>|]/g, "")
            .trim()
            .replace(/\s+/g, "_") || "incident";
        const d = new Date();
        const stamp =
          d.getFullYear() +
          String(d.getMonth() + 1).padStart(2, "0") +
          String(d.getDate()).padStart(2, "0") +
          "_" +
          String(d.getHours()).padStart(2, "0") +
          String(d.getMinutes()).padStart(2, "0");
        const filename = `Incident_${title}_${stamp}.txt`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showSaveStatus("✓ Export TXT berhasil");
      }

      function importTxt(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const content = e.target.result;
            const jsonMatch = content.match(
              /--- INCIDENT_DATA_JSON ---\n([\s\S]*?)\n--- END_INCIDENT_DATA_JSON ---/,
            );
            if (!jsonMatch || !jsonMatch[1]) {
              throw new Error("Format TXT tidak valid");
            }

            const imported = JSON.parse(jsonMatch[1]);
            if (
              !imported ||
              !imported.format.includes("INCIDENT_NOTIFICATION_TEMPLATE") ||
              !imported.data
            ) {
              throw new Error("Format data tidak sesuai");
            }

            if (
              !confirm(
                "Import akan mengganti isi form saat ini dengan data dari file TXT. Lanjutkan?",
              )
            ) {
              event.target.value = "";
              return;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(imported.data));
            location.reload();
          } catch (err) {
            alert(
              "Import gagal. Pastikan file .txt berasal dari fitur Export TXT aplikasi ini.",
            );
          } finally {
            event.target.value = "";
          }
        };
        reader.onerror = function () {
          alert("File TXT tidak dapat dibaca.");
          event.target.value = "";
        };
        reader.readAsText(file, "UTF-8");
      }

      function copyText() {
        const text = document.getElementById("output").textContent;
        navigator.clipboard.writeText(text);
        showSaveStatus("✓ Teks berhasil di-copy");
      }
    </script>
  </body>
</html>
